
# ============================================================
# CONTROL SURFACES
#
# Span coordinates normalized by wing semi-span:
#   eta = 0: root
#   eta = 1: tip
#
# Hinge locations measured from local leading edge:
#   0.0: LE
#   1.0: TE
# ============================================================

control_surfaces:

  # ----------------------------------------------------------
  # INBOARD CONTROL (e.g., flap)
  # ----------------------------------------------------------
  - name: flap
    surface: wing

    span:
      start: 0.15
      end: 0.40

    hinge:
      root_chord_fraction: 0.75
      tip_chord_fraction: 0.75

    gain: 1.0 # Scales control deflection (1.0 = 1:1)
    duplicate_sign: 1.0  # Symmetric deflection
    # duplicate_sign: -1.0  # Antisymmetric deflection

  # ----------------------------------------------------------
  # OUTBOARD AILERON
  # ----------------------------------------------------------
  - name: aileron
    surface: wing

    span:
      start: 0.75
      end: 0.95

    hinge:
      root_chord_fraction: 0.75
      tip_chord_fraction: 0.75

    gain: 1.0  # Scales control deflection (1.0 = 1:1)
    # duplicate_sign: 1.0  # Symmetric deflection
    duplicate_sign: -1.0  # Antisymmetric deflection


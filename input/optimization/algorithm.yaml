
# ============================================================
# OPTIMIZATION ALGORITHM
#
# Select ONE algorithm by uncommenting its method.
# All other algorithms remain commented out.
#
# Available:
#   COBYLA : Local, derivative-free optimization
#   DE     : Differential Evolution (global optimization)
#
# 
# ============================================================

algorithm:

  # ----------------------------------------------------------
  # 1. COBYLA (ACTIVE)
  # Constrained Optimization By Linear Approximation
  # ----------------------------------------------------------

  method: COBYLA

  maxiter: 500       # Maximum function evaluations
  rhobeg: 0.5        # Initial trust-region radius
  tol: 1.0e-5        # Final trust-region radius
  catol: 1.0e-4      # Constraint violation tolerance
  disp: false        # Print solver diagnostics


  # ----------------------------------------------------------
  # 2. DIFFERENTIAL EVOLUTION (INACTIVE)
  # Global, population-based optimization
  # ----------------------------------------------------------

  # method: DE

  # maxiter: 100         # Maximum number of generations
  # popsize: 10          # Population multiplier
  # strategy: best1bin   # Evolution strategy
  # mutation: [0.5, 1.0] # Differential weight range
  # recombination: 0.7   # Crossover probability
  # tol: 1.0e-4          # Relative convergence tolerance
  # atol: 0.0            # Absolute convergence tolerance
  # polish: false        # Disable final local optimization
  # seed: 42             # Reproducibility
  # disp: false          # Print solver diagnostics

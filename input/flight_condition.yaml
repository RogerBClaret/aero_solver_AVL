
# ============================================================
# FLIGHT CONDITION
# SI units, angles in degrees
# ============================================================

flight_condition:

  # ----------------------------------------------------------
  # FREESTREAM CONDITIONS
  # ----------------------------------------------------------
  velocity: 100.0    # True airspeed [m/s]
  density: 1.225     # Air density [kg/m^3]

  # ----------------------------------------------------------
  # FIXED ANGLE OF ATTACK
  # Used when trim.enabled = false
  # ----------------------------------------------------------
  alpha: 5.0         # [deg]

  # ----------------------------------------------------------
  # CONTROL DEFLECTIONS
  # ----------------------------------------------------------
  controls:
    # Use the names defined in the control_surfaces.yaml file
    flap: 0.0     # [deg]
    aileron: 0.0     # [deg]

  # ----------------------------------------------------------
  # AVL TRIM / OPERATING POINT
  # Enable ONE independent trim constraint at a time.
  # ----------------------------------------------------------
  trim:
    enabled: true

    # Option A: Solve alpha for required dimensional lift
    variable: alpha
    constraint: Lift
    target: 2943.0       # Required total lift [N]

    # Option B: Solve alpha for specified CL
    # variable: alpha
    # constraint: CL
    # target: 0.5

    # Option C: Solve control deflection for zero Cm
    # variable: flap
    # constraint: Cm
    # target: 0.0

    # Option D: Solve aileron for zero rolling moment
    # variable: aileron
    # constraint: Cl
    # target: 0.0
